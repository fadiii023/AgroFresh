<!DOCTYPE html><html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        
        <link rel="icon" type="image/png" href="../assets/images/logo.png">
        <title>Products | AgroFresh</title>
        <link rel="stylesheet" href="assets/css/style.css">
    </head>
    <body>
        <div id="site-header"></div>
        <main>
            <section class="page-hero">
                <div class="container">
                    <span class="eyebrow">PRODUCT CATALOG</span>
                    <h1>Fresh Pakistani Agricultural Products</h1>
                    <p>Explore our range of products prepared for international B2B buyers.</p>
                </div>
            </section>
            <section class="section">
                <div class="container">
                    <div class="filters">
                        <button class="filter active" data-filter="all">All Products</button>
                        <button class="filter" data-filter="vegetables">Vegetables</button>
                        <button class="filter" data-filter="fruits">Fruits</button>
                        <button class="filter" data-filter="specialty">Specialty</button>
                    </div>
                    <div class="product-grid" id="all-products"></div>
                </div>
            </section>
        </main>
        <div id="site-footer"></div>
        <script src="assets/js/data.js"></script>
        <script src="assets/js/components.js"></script>
        <script src="assets/js/main.js"></script>
    </body>
</html>
